name: Deploy classroom to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build classroom for repository subdirectory
        run: npm run build
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
          # Public URL only. API keys must never be GitHub Pages build inputs.
          VITE_CLASSROOM_API_URL: ${{ vars.CLASSROOM_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish classroom
        id: deployment
        uses: actions/deploy-pages@v4
